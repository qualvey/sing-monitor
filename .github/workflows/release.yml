name: release

# CD：打 tag（v*）触发，构建二进制 + deb 包并发布
# 用法：git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write      # 创建 GitHub Release

jobs:
  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cd server
          # 固定文件名（nfpm 依赖），版本号注入 ldflags
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "../dist/sing-monitor-server" .
          cd ..

      - name: Package deb (linux)
        if: matrix.os == 'linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -sSfL https://nfpm.goreleaser.com/install.sh | sh
          sed "s/__VERSION__/${VERSION}/g; s/__ARCH__/${{ matrix.arch }}/g" nfpm.yaml > nfpm.gen.yaml
          ./bin/nfpm package -p deb -f nfpm.gen.yaml -t "dist/sing-monitor_${VERSION}_${{ matrix.arch }}.deb"
          # 配置示例一并发布
          cp server/config.example.json "dist/config.example.json"
          # 二进制改回带版本名
          mv dist/sing-monitor-server "dist/sing-monitor-server_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"

      - name: Rename binary (windows)
        if: matrix.os == 'windows'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv dist/sing-monitor-server "dist/sing-monitor-server_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.ext }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sing-monitor-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
